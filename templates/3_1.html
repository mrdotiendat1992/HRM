{% extends "base.html" %}
{% block style %}
<style>
/* ── Variables ── */
:root {
  --blue:     #4e73df;
  --blue-dk:  #2e59d9;
  --blue-lt:  #eef2ff;
  --green:    #1cc88a;
  --border:   #e3e6f0;
  --text:     #3d3d3d;
  --muted:    #8898aa;
  --bg:       #f0f2f8;
  --surface:  #ffffff;
  --r:        10px;
  --r-sm:     6px;
  --shadow:   0 2px 12px rgba(78,115,223,.10);
  --tr:       all .2s ease;
}

/* ── Layout ── */
.form-page      { max-width: 960px; margin: 0 auto; padding-bottom: 48px; }
.form-card      { background: var(--surface); border-radius: var(--r);
                  box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.form-card-head { background: linear-gradient(135deg, var(--blue), var(--blue-dk));
                  color: #fff; padding: 12px 20px;
                  display: flex; align-items: center; gap: 10px; }
.form-card-head i   { font-size: .9rem; opacity: .85; }
.form-card-head h6  { margin: 0; font-weight: 800; font-size: .88rem; letter-spacing: .04em; }
.form-card-body { padding: 20px 24px; }

/* ── Avatar upload ── */
.avatar-zone { display: flex; align-items: center; gap: 24px; margin-bottom: 4px; }
.avatar-wrap {
  width: 110px; height: 110px; border-radius: 50%;
  border: 3px dashed var(--border);
  background: var(--blue-lt);
  cursor: pointer; overflow: hidden;
  transition: var(--tr); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.avatar-wrap:hover { border-color: var(--blue); }
.avatar-wrap img   { width: 100%; height: 100%; object-fit: cover; }
.avatar-hint { font-size: .78rem; color: var(--muted); margin-top: 6px; }
#anh { display: none; }

/* MST badge */
.mst-badge {
  background: var(--blue-lt); border: 1px solid #c5d0f7;
  border-radius: var(--r-sm); padding: 8px 16px;
  font-size: 1rem; font-weight: 800; color: var(--blue);
  letter-spacing: .06em;
}

/* ── Field grid ── */
.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px 20px;
}
.field-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.field-grid.cols-1 { grid-template-columns: 1fr; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: .72rem; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 0;
}
.field input, .field select {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-family: inherit; font-size: .86rem; color: var(--text);
  background: #fafbff;
  transition: var(--tr);
}
.field input:focus, .field select:focus {
  outline: none; border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(78,115,223,.12);
  background: #fff;
}
.field input[readonly] {
  background: var(--blue-lt); color: var(--blue);
  font-weight: 700; border-color: #c5d0f7; cursor: default;
}

/* NTID preview */
.ntid-preview {
  background: #f8f9ff; border: 1.5px dashed #c5d0f7;
  border-radius: var(--r-sm); padding: 8px 12px;
  font-size: .82rem; font-weight: 700; color: var(--blue);
  letter-spacing: .04em; min-height: 38px;
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.ntid-preview .seg       { opacity: .45; }
.ntid-preview .seg.filled { opacity: 1; }

/* Children section */
.children-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 20px;
}
.child-row {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 10px;
  align-items: end;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: #fafbff;
}
.child-row .child-num {
  font-size: .7rem; font-weight: 800;
  color: var(--blue); opacity: .6;
  text-transform: uppercase; letter-spacing: .08em;
  grid-column: 1/-1; margin-bottom: -4px;
}

/* Divider */
.section-divider {
  border: none; border-top: 2px dashed var(--border);
  margin: 4px 0 16px;
}

/* Submit */
.btn-save {
  background: linear-gradient(135deg, var(--blue), var(--blue-dk));
  color: #fff; border: none;
  padding: 11px 40px; border-radius: var(--r-sm);
  font-weight: 800; font-size: .92rem; letter-spacing: .04em;
  cursor: pointer; transition: var(--tr);
  box-shadow: 0 4px 14px rgba(78,115,223,.35);
}
.btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(78,115,223,.45); }
.btn-save:active{ transform: translateY(0); }

/* QR scan field highlight */
#scan-qrcode:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(28,200,138,.15);
}

@media (max-width: 640px) {
  .field-grid, .children-grid { grid-template-columns: 1fr; }
  .child-row { grid-template-columns: 1fr; }
  .cols-2    { grid-template-columns: 1fr; }
}
</style>
{% endblock style %}

{% block content %}
<div class="form-page">
  <form action="/muc3_1" method="POST" enctype="multipart/form-data" id="mainForm">

    <!-- ══ Avatar + MST ══ -->

      <div class="form-card-head">

        </div>

    </div>

    <!-- ══ CCCD ══ -->

      <div class="form-card-body">

          </div>

          </div>
          <div class="field">
            <label>Chứng minh thư</label>
            <input type="text" id="cmt" name="cmt">
          </div>
          <div class="field">
            <label>Họ và tên</label>
            <input type="text" id="hoten" name="hoten">
          </div>
          <div class="field">
            <label>Ngày sinh</label>
            <input type="date" id="ngaysinh" name="ngaysinh">
          </div>
          <div class="field">
            <label>Giới tính</label>

          </div>
          <div class="field">
            <label>Quốc tịch</label>
            <input type="text" id="quoctich" name="quoctich">
          </div>
          <div class="field">
            <label>Thôn/xóm</label>
            <input type="text" id="thonxom" name="thonxom">
          </div>
          <div class="field">
            <label>Phường/Xã</label>
            <input type="text" id="phuongxa" name="phuongxa">
          </div>
          <div class="field">
            <label>Quận/Huyện</label>
            <input type="text" id="quanhuyen" name="quanhuyen">
          </div>
          <div class="field">
            <label>Tỉnh/Thành phố</label>
            <input type="text" id="tinhthanhpho" name="tinhthanhpho">
          </div>
          <div class="field cols-2" style="grid-column:1/-1;">
            <label>Tạm trú</label>

          </div>
          <div class="field" style="grid-column:1/-1;">
            <label>Thường trú</label>

    <!-- ══ Tuyển dụng ══ -->

      <div class="form-card-head">
        <i class="fas fa-briefcase"></i>
        <h6>Thông tin tuyển dụng</h6>
      </div>
      <div class="form-card-body">
        <div class="field-grid">
          <div class="field">
            <label>Dân tộc</label>

          </div>
          <div class="field">
            <label>Tôn giáo</label>
            <input type="text" id="tongiao" name="tongiao">
          </div>
          <div class="field">
            <label>Học vấn</label>
            <input type="text" id="hocvan" name="hocvan">
          </div>
          <div class="field">
            <label>Điện thoại</label>

          </div>
          <div class="field">
            <label>Mã số thuế</label>
            <input type="text" id="masothue" name="masothue">
          </div>
          <div class="field">
            <label>Số BHXH</label>
            <input type="text" id="sobhxh" name="sobhxh">
          </div>
          <div class="field">
            <label>Ngân hàng</label>
            <input type="text" id="nganhang" name="nganhang">
          </div>
          <div class="field">
            <label>Số tài khoản</label>
            <input type="text" id="sotaikhoan" name="sotaikhoan">
          </div>
          <div class="field">
            <label>Có con nhỏ</label>
            <input type="text" id="connho" name="connho">
          </div>
          <div class="field">
            <label>Người thân</label>
            <input type="text" id="nguoithan" name="nguoithan">
          </div>
          <div class="field">
            <label>SĐT người thân</label>
            <input type="text" id="sdtnguoithan" name="sdtnguoithan">
          </div>
        </div>

        <hr class="section-divider" style="margin-top:18px;">
        <div style="font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;">
          <i class="fas fa-baby mr-1"></i>Thông tin con nhỏ
        </div>
        <div class="children-grid">
          {% for i in range(1, 6) %}
          <div class="child-row">
            <span class="child-num">Con {{i}}</span>
            <div class="field">
              <label>Họ tên</label>
              <input type="text" id="tenconnho{{i}}" name="tenconnho{{i}}">
            </div>
            <div class="field">
              <label>Ngày sinh</label>
              <input type="date" id="ngaysinhcon{{i}}" name="ngaysinhcon{{i}}">
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>

    <!-- ══ Vị trí làm việc ══ -->
    <div class="form-card">
      <div class="form-card-head">
        <i class="fas fa-map-marker-alt"></i>
        <h6>Vị trí làm việc</h6>
      </div>
      <div class="form-card-body">
        <div class="field-grid">
          <div class="field">
            <label>Detail job title (VN)</label>
            <select id="vitri" name="vitri">
              <option value="">Chọn vị trí</option>
              {% for vitri in cacvitri %}
              <option value="{{ vitri }}">{{ vitri }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>Line</label>
            <select id="line" name="line"></select>
          </div>
          <div class="field">
            <label>Ca làm việc</label>
            <input id="calamviec" name="calamviec">
          </div>
          <div class="field">
            <label>Factory</label>
            <input type="text" id="nhamay" name="nhamay" value="{{macongty}}">
          </div>
          <div class="field">
            <label>Headcount category</label>
            <input type="text" id="hccategory" name="hccategory">
          </div>
          <div class="field">
            <label>Grade Code</label>
            <input type="text" id="gradecode" name="gradecode">
          </div>
          <div class="field">
            <label>Department</label>
            <input type="text" id="phongban" name="phongban">
          </div>
          <div class="field">
            <label>Chức danh</label>
            <input type="text" id="chucvu" name="chucvu">
          </div>
          <div class="field">
            <label>Employee type</label>
            <input type="text" id="loailaodong" name="loailaodong">
          </div>
          <div class="field">
            <label>Section Code</label>
            <input type="text" id="mabophan" name="mabophan">
          </div>
          <div class="field">
            <label>Section Description</label>
            <input type="text" id="bophan" name="bophan">
          </div>
          <div class="field">
            <label>Detail job title (EN)</label>
            <input type="text" id="vitrien" name="vitrien">
          </div>
          <div class="field">
            <label>Position Code</label>
            <input type="text" id="mavitri" name="mavitri">
          </div>
          <div class="field">
            <label>Position Code Description</label>
            <input type="text" id="tenvitri" name="tenvitri">
          </div>
        </div>
      </div>
    </div>

    <!-- ══ NTID ══ -->
    <div class="form-card">
      <div class="form-card-head">
        <i class="fas fa-fingerprint"></i>
        <h6>NTID</h6>
      </div>
      <div class="form-card-body">
        <div class="field-grid" style="margin-bottom:16px;">
          <div class="field">
            <label>Công ty trả lương</label>
            <input type="text" id="congtytraluong" value="0{{current_user.macongty[-1]}}">
          </div>
          <div class="field">
            <label>Đối tượng chịu chi phí</label>
            <input type="text" id="doituongchiuchiphi">
          </div>
          <div class="field">
            <label>Phòng ban</label>
            <input type="text" id="phongban10">
          </div>
          <div class="field">
            <label>Phân loại lao động</label>
            <input type="text" id="phanloailaodong">
          </div>
          <div class="field">
            <label>Mã số nhân viên</label>
            <!-- Gợi ý: masothe thêm 0 đứng đầu cho đủ 6 ký tự -->
            <input type="text" id="msnv"
                   value="{{ masothe | string }}">
          </div>
        </div>

        <!-- NTID preview -->
        <div class="field">
          <label><i class="fas fa-link mr-1"></i>NTID</label>
          <div class="ntid-preview" id="ntid-preview">—</div>
          <input type="hidden" id="ntid" name="ntid">
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div style="text-align:right;">
      <button type="submit" class="btn-save" onclick="return submitForm()">
        <i class="fas fa-save mr-2"></i>Lưu hồ sơ
      </button>
    </div>

  </form>
</div>

<script>
/* ═══ Helpers ═══ */
function parseDate(s) {
  const [d,m,y] = s.split("/");
  return new Date(y, m-1, d).toISOString().split('T')[0];
}
function strtodate(s) {
  return `${s.substring(4,8)}-${s.substring(2,4)}-${s.substring(0,2)}`;
}
function buildAddress() {
  return [
    document.getElementById("thonxom").value,
    document.getElementById("phuongxa").value,
    document.getElementById("quanhuyen").value,
    document.getElementById("tinhthanhpho").value
  ].join(",");
}

/* ═══ MSNV: pad to 6 chars ═══ */
function padMsnv(val) {
  return String(val).padStart(6, '0');
}

/* ═══ NTID auto-build ═══ */
function buildNtid() {
  const parts = [
    document.getElementById("congtytraluong").value.trim(),
    document.getElementById("doituongchiuchiphi").value.trim(),
    document.getElementById("phongban10").value.trim(),
    document.getElementById("phanloailaodong").value.trim(),
    document.getElementById("msnv").value.trim(),
  ];
  const ntid = parts.join("");
  document.getElementById("ntid").value = ntid;

  // Visual preview with colored segments
  const labels = ["CT","ĐTCCP","PB","PLLĐ","MSNV"];
  const preview = document.getElementById("ntid-preview");
  if (parts.every(p => p === "")) {
    preview.innerHTML = "<span style='color:var(--muted);font-weight:400;font-size:.8rem;'>Điền các trường để xem NTID…</span>";
    return;
  }
  preview.innerHTML = parts.map((p, i) =>
    `<span class="seg ${p ? 'filled' : ''}" title="${labels[i]}">${p || '?'}</span>`
  ).join("");
}

// Watch all NTID-related fields
["congtytraluong","doituongchiuchiphi","phongban10","phanloailaodong","msnv"]
  .forEach(id => document.getElementById(id).addEventListener("input", buildNtid));

// Init on load
document.addEventListener("DOMContentLoaded", function() {
  // Pad MSNV
  const msnvEl = document.getElementById("msnv");
  msnvEl.value = padMsnv(msnvEl.value);
  msnvEl.addEventListener("change", function() {
    this.value = padMsnv(this.value);
    buildNtid();
  });
  buildNtid();
});

/* ═══ Address auto-sync ═══ */
["thonxom","phuongxa","quanhuyen","tinhthanhpho"].forEach(function(id) {
  document.getElementById(id).addEventListener("change", function() {
    var addr = buildAddress();
    document.getElementById("thuongtru").value = addr;
    document.getElementById("tamtru").value    = addr;
    document.getElementById("noisinh").value   = addr;
  });
});

/* ═══ Fill CCCD data ═══ */
function fillCccdData(data) {
  var fields = {
    "dantoc": data["Dân tộc"]?.replace(/'/g,''),
    "tongiao": data["Tôn giáo"],
    "dienthoai": data["Số điện thoại"],
    "quoctich": data["Quốc tịch"],
    "hocvan": data["Trình độ học vấn"],
    "masothue": data["Mã số thuế"],
    "nganhang": data["Ngân hàng"],
    "sotaikhoan": data["Số tài khoản"],
    "connho": data["Con nhỏ"],
    "noisinh": data["Nơi sinh"],
    "sobhxh": data["Số BHXH"],
    "tamtru": data["Tạm trú"],
    "nguoithan": data["Tên người thân"],
    "sdtnguoithan": data["SĐT người thân"],
  };
  Object.entries(fields).forEach(([id, val]) => {
    if (val != null && document.getElementById(id)) document.getElementById(id).value = val;
  });
  for (var i = 1; i <= 5; i++) {
    if (data[`Tên con ${i}`])     document.getElementById(`tenconnho${i}`).value = data[`Tên con ${i}`];
    if (data[`Ngày sinh con ${i}`]) document.getElementById(`ngaysinhcon${i}`).value = parseDate(data[`Ngày sinh con ${i}`]);
  }
}

/* ═══ Scan QR CCCD ═══ */
document.getElementById("scan-qrcode").addEventListener("change", function() {
  var raw = this.value.replace(/'/g, '');
  this.value = raw;
  if (!raw) return;

  var d = raw.split("|");
  if (d.length >= 7) {
    document.getElementById("cccd").value     = d[0];
    document.getElementById("cmt").value      = d[1];
    document.getElementById("hoten").value    = d[2];
    document.getElementById("ngaysinh").value = strtodate(d[3]);
    document.getElementById("gioitinh").value = d[4];
    document.getElementById("ngaycap").value  = strtodate(d[6]);
    var addr = d[5].split(",");
    document.getElementById("thonxom").value     = addr[0]||"";
    document.getElementById("phuongxa").value    = addr[1]||"";
    document.getElementById("quanhuyen").value   = addr[2]||"";
    document.getElementById("tinhthanhpho").value= addr[3]||"";
    document.getElementById("thuongtru").value   = d[5];
    document.getElementById("tamtru").value      = d[5];
    document.getElementById("noisinh").value     = d[5];
    document.getElementById("noicap").value      = "Cục cảnh sát";
  } else if (d.length === 6) {
    document.getElementById("cccd").value     = d[0];
    document.getElementById("hoten").value    = d[1];
    document.getElementById("ngaysinh").value = strtodate(d[2]);
    document.getElementById("gioitinh").value = d[3];
    document.getElementById("ngaycap").value  = strtodate(d[5]);
    var addr = d[4].split(",");
    document.getElementById("thonxom").value     = addr[0]||"";
    document.getElementById("phuongxa").value    = addr[1]||"";
    document.getElementById("quanhuyen").value   = addr[2]||"";
    document.getElementById("tinhthanhpho").value= addr[3]||"";
    document.getElementById("tamtru").value      = d[4];
    document.getElementById("noisinh").value     = d[4];
    document.getElementById("noicap").value      = "Cục cảnh sát";
  } else {
    alert("Thông tin CCCD không chính xác. Vui lòng nhập lại.");
    return;
  }
  document.getElementById("quoctich").value = "Việt Nam";

  // Check retirement age
  axios.post('/laythongtinnghihuu', null, {
    params: { gioitinh: document.getElementById("gioitinh").value }
  }).then(function(res) {
    if (!res.data?.length) return;
    var [,, nam, thang] = res.data[0];
    var ns = new Date(document.getElementById("ngaysinh").value);
    var nghiHuu = new Date(ns);
    nghiHuu.setFullYear(nghiHuu.getFullYear() + nam);
    nghiHuu.setMonth(nghiHuu.getMonth() + thang);
    var con = (nghiHuu.getFullYear() - new Date().getFullYear()) * 12
            + (nghiHuu.getMonth() - new Date().getMonth());
    if (con >= 0 && con <= 12) alert("⚠️ NLĐ sẽ đến tuổi nghỉ hưu trong vòng 1 năm tới! Ngày: " + nghiHuu.toLocaleDateString());
    else if (con < 0) alert("ℹ️ NLĐ đã quá tuổi nghỉ hưu");
  });

  // Check duplicate CCCD
  axios.post('/laythongtincccd?cccd=' + document.getElementById("cccd").value)
    .then(function(res) {
      alert("Tìm thấy ứng viên có CCCD " + document.getElementById("cccd").value + " trùng thông tin");
      fillCccdData(res.data);
    }).catch(() => alert("Không có ứng viên nào trùng CCCD " + document.getElementById("cccd").value));
});

document.getElementById("cccd").addEventListener("change", function() {
  if (!this.value) return;
  axios.post('/laythongtincccd?cccd=' + this.value)
    .then(res => fillCccdData(res.data))
    .catch(() => {});
});

/* ═══ Vị trí → Line → HC ═══ */
document.getElementById("vitri").addEventListener("change", function() {
  var vitri = this.value;
  axios.post('/check_line_from_detailjob?vitrimoi=' + vitri).then(function(res) {
    if (!Array.isArray(res.data)) return;
    var sel = document.getElementById('line');
    sel.innerHTML = '';
    res.data.forEach(function(item) {
      var o = document.createElement('option'); o.value = o.text = item; sel.appendChild(o);
    });
    loadHC(vitri, res.data[0]);
  });
});

document.getElementById("line").addEventListener("change", function() {
  loadHC(document.getElementById("vitri").value, this.value);
});

function loadHC(vitri, line) {
  axios.post('/check_hcname?vitri=' + vitri + '&line=' + line).then(function(res) {
    var d = res.data;
    if (!d) return;
    var map = {
      "vitrien": "Detail_job_title_EN", "gradecode": "Grade_code",
      "mabophan": "Section_code",       "hccategory": "HC_category",
      "phongban": "Department",          "bophan": "Section_description",
      "loailaodong": "Employee_type",   "mavitri": "Position_code",
      "tenvitri": "Position_code_description", "chucvu": "Chuc_vu",
    };
    Object.entries(map).forEach(([id, key]) => {
      if (d[key] != null) document.getElementById(id).value = d[key];
    });
    axios.post('/laycatheoline?line=' + d["Line"]).then(function(r) {
      document.getElementById("calamviec").value = r.data['Ca'];
    });
  });
}

/* ═══ Avatar preview ═══ */
document.addEventListener("DOMContentLoaded", function() {
  document.getElementById('anh').addEventListener('change', function(e) {
    var f = e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(ev) { document.getElementById('previewImage').src = ev.target.result; };
    r.readAsDataURL(f);
  });
});

/* ═══ Submit confirm ═══ */
function submitForm() {
  return window.confirm("Bạn đã chắc chắn các thông tin nhập vào là đúng?");
}
</script>
