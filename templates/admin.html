<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>Quản trị hệ thống</title>
</head>
<body>
    <div class="container">
        <br>
        <div class="row">
            <a class="navbar-brand" href="/">
                <img src="/static/img/logo.png" alt="Logo" width="60" class="d-inline-block align-text-top">
            </a>
        </div>
        <div class="row">
            <div class="col">
                <h3>Function 12</h3>
                <div class="navbar-brand">
                    {% if trangthai=="0" %}
                        <form action="/bat_12" method="POST">
                            <button type="submit" class="btn btn-success btn-sm">Bật</button>
                        </form>
                    {% else %}
                        <form action="/tat_12" method="POST">
                            <button type="submit" class="btn btn-danger btn-sm">Tắt</button>
                        </form>
                    {% endif %}
                </div>
            </div class="col">
            <div class="col">
                <h3>Chấm công tự động</h3>
                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#chamcongModal">Lịch sử</button>
                <div class="modal fade" id="chamcongModal" tabindex="-1" role="dialog" aria-labelledby="chamcongModal" aria-hidden="true">
                <div class="modal-dialog modal-lg" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="chamcongModalLabel">Lịch sử</h5>
                            <button type="button" class="btn btn-circle" data-dismiss="#modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <div class="modal-body modal-lg">
                            <div class="container" id="frame">
                                <table class="table table-strip table-responsive table-hover">
                                    <thead>
                                        <tr>
                                            <th>Ngày</th>
                                            <th>Máy 1</th>
                                            <th>Máy 2</th>
                                            <th>Máy 3</th>
                                            <th>Máy 4</th>
                                            <th>Máy 5</th>
                                            <th>Máy 6</th>
                                            <th>Máy 7</th>
                                            <th>Máy 8</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {% for row in rows %}
                                        <tr>
                                            <td>{{row[0]}}</td>
                                            <td>{{row[1]}}</td>
                                            <td>{{row[2]}}</td>
                                            <td>{{row[3]}}</td>
                                            <td>{{row[4]}}</td>
                                            <td>{{row[5]}}</td>
                                            <td>{{row[6]}}</td>
                                            <td>{{row[7]}}</td>
                                            <td>{{row[8]}}</td>
                                        </tr>
                                        {% endfor %}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        
    </script>
