<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - HRM Mobile</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f5f5f5; }
    .container { max-width: 420px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: #fff; border-radius: 12px; padding: 24px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
    .subtitle { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #333; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #0077cc; box-shadow: 0 0 0 2px rgba(0,119,204,0.15); }
    .field { margin-bottom: 14px; }
    .btn { width: 100%; padding: 11px 14px; font-size: 15px; border-radius: 999px; border: none; color: #fff; background: #0077cc; font-weight: 600; margin-top: 6px; }
    .btn:active { opacity: 0.88; }
    .footer { margin-top: 16px; font-size: 11px; text-align: center; color: #999; }
    .flash { margin-bottom: 10px; font-size: 13px; color: #c00; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="text-align:center; margin-bottom:16px;">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo công ty" style="max-width:160px; height:auto;" />
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="field">
          <label for="macongty">Nhà máy</label>
          <select id="macongty" name="macongty" required style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;">
            <option value="">-- Chọn nhà máy --</option>
            <option value="NT1">NT1</option>
            <option value="NT2">NT2</option>
          </select>
        </div>
        <div class="field">
          <label for="masothe">Mã số thẻ</label>
          <input id="masothe" name="masothe" type="text" required>
        </div>
        <div class="field">
          <label for="matkhau">Mật khẩu</label>
          <input id="matkhau" name="matkhau" type="password" required>
        </div>
        <button class="btn" type="submit">Đăng nhập</button>
      </form>
    </div>
    <div class="footer">Homemate Mobile</div>
  </div>
</body>
</html>
